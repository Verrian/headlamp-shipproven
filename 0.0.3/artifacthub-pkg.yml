readme: |
  # ShipProven for Headlamp

  **Autonomous code, proven before it ships.**

  [ShipProven](https://shipproven.com) is autonomous software engineering
  that can't ship unsafe code. Every change its AI agents produce must
  survive the same production pipeline a human engineer's would — and win
  the approval of a consensus of independent models — before it can merge.

  This plugin shows that work inside Headlamp, on any cluster running
  ShipProven.

  ## What you see

  - **Plans** — every Plan with its phase and progress, and which steps are
    active right now.
  - **The pipeline** — each Plan's steps drawn as a dependency graph, in the
    order they run. Every step shows its phase, whether it opens a pull
    request, applies a change or checks one, its PASS/FAIL verdict, the agent
    type that ran it, and a link to its pull request.
  - **Agent Runs** — the run behind each step: its pull request and branch,
    iterations against budget, and the Job and pods that did the work, with
    their logs.
  - **Plan Templates and Agent Types** — the reusable pipelines and the
    agent runtimes they execute on.
  - **Map view** — a ShipProven layer linking Plans to Agent Runs to Jobs,
    with the order between steps drawn in.

  ## Requirements

  A cluster running ShipProven. The plugin reads the ShipProven resources
  already there and needs nothing else set up; on a cluster without
  ShipProven the section is simply empty.

  ## Learn more

  To see ShipProven on your own codebase, book a technical walkthrough at
  [shipproven.com](https://shipproven.com).
